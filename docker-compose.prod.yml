services:
  backend:
    image: ${ECR_REGISTRY}/go-watchtower/backend:latest
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    container_name: go-watchtower-backend
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_EXPIRES_IN: ${ACCESS_TOKEN_EXPIRES_IN}
      REFRESH_TOKEN_EXPIRES_DAYS: ${REFRESH_TOKEN_EXPIRES_DAYS}
      REFRESH_TOKEN_ROTATION_GRACE_SECONDS: ${REFRESH_TOKEN_ROTATION_GRACE_SECONDS:-300}
      WATCHTOWER_CLI_TOKEN_PEPPER: ${WATCHTOWER_CLI_TOKEN_PEPPER}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      COOKIE_SECURE: "false"
      COOKIE_SAME_SITE: lax
      # Runbook Automation reconciler (opt-in; modalità completa invia su SQS)
      RECONCILER_ENABLED: ${RECONCILER_ENABLED:-false}
      RECONCILER_INTERVAL_MS: ${RECONCILER_INTERVAL_MS:-60000}
      EXECUTE_RUNBOOK_QUEUE_REGISTRY_PARAMETER: ${EXECUTE_RUNBOOK_QUEUE_REGISTRY_PARAMETER:-}
      EXECUTE_RUNBOOK_QUEUE_REGISTRY_REGION: ${EXECUTE_RUNBOOK_QUEUE_REGISTRY_REGION:-eu-south-1}
      # Catalogo globale runbook automatici — sync S3 (EVO-SLACKINGRA-CODEX-03 §9).
      # Bucket vuoto = sync disabilitato; l'environment DEVE coincidere con quello
      # del catalogo pubblicato da go-automation, altrimenti il sync lo rifiuta.
      AUTOMATIC_RUNBOOK_CATALOG_BUCKET: ${AUTOMATIC_RUNBOOK_CATALOG_BUCKET:-}
      AUTOMATIC_RUNBOOK_CATALOG_REGION: ${AUTOMATIC_RUNBOOK_CATALOG_REGION:-eu-south-1}
      AUTOMATIC_RUNBOOK_CATALOG_ENVIRONMENT: ${AUTOMATIC_RUNBOOK_CATALOG_ENVIRONMENT:-production}
      # Token bot Slack usato dal backend per il test read-only di accesso ai canali
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  frontend:
    image: ${ECR_REGISTRY}/go-watchtower/frontend:latest
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
      args:
        # NEXT_PUBLIC_API_URL viene baked nell'HTML al momento del build.
        # Deve essere l'URL pubblico dell'API raggiungibile dal browser.
        NEXT_PUBLIC_API_URL: "http://${EC2_HOST}:3001"
    container_name: go-watchtower-frontend
    restart: unless-stopped
    ports:
      - "80:3000"
    environment:
      NODE_ENV: production
      # URL interno Docker per le chiamate server-side (SSR)
      API_URL_INTERNAL: http://backend:3000
      AUTH_SECRET: ${AUTH_SECRET}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      AUTH_TRUST_HOST: "true"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/auth/session"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
